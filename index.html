<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sardegna — gesproken rijgids</title>

<!-- Add-to-Home-Screen behaviour on iOS: hides Safari's chrome and gives
     the app a proper full-screen feel once launched from the icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sardegna">
<meta name="theme-color" content="#101418">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">

<!-- Deliberately inline and non-module, placed before everything else, so
     it is already listening if one of the modules below fails to load.
     A phone has no console; without this a startup error is just a blank
     screen and a message with no clue where it came from. -->
<script>
(function () {
  function show(title, detail) {
    var box = document.getElementById('crash-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'crash-box';
      box.setAttribute('style',
        'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;' +
        'background:#2A1512;border:1px solid #C25030;border-radius:12px;' +
        'padding:12px 14px;color:#F3E7E4;font:12px/1.45 ui-monospace,Menlo,monospace;' +
        'max-height:52vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.5)');
      document.body ? document.body.appendChild(box) : null;
    }
    if (!box.parentNode && document.body) document.body.appendChild(box);
    var text = title + '\n' + detail;
    box.innerHTML =
      '<div style="font-weight:700;color:#F0A48C;margin-bottom:6px">⚠︎ Er ging iets mis bij het starten</div>' +
      '<pre id="crash-text" style="margin:0;white-space:pre-wrap;word-break:break-word"></pre>' +
      '<div style="margin-top:10px;display:flex;gap:8px">' +
      '<button id="crash-copy" style="flex:1;padding:8px;border:0;border-radius:8px;background:#C25030;color:#fff;font:600 12px system-ui">Kopieer</button>' +
      '<button id="crash-hide" style="flex:1;padding:8px;border:1px solid #7A3A2A;border-radius:8px;background:none;color:#F3E7E4;font:600 12px system-ui">Verberg</button>' +
      '</div>';
    box.querySelector('#crash-text').textContent = text;
    box.querySelector('#crash-copy').onclick = function () {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      this.textContent = 'Gekopieerd';
    };
    box.querySelector('#crash-hide').onclick = function () { box.remove(); };
  }

  window.addEventListener('error', function (e) {
    var where = (e.filename || '?').split('/').slice(-1)[0] + ':' + (e.lineno || '?') + ':' + (e.colno || '?');
    show(e.message || 'Onbekende fout', where + (e.error && e.error.stack ? '\n\n' + e.error.stack : ''));
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('Unhandled promise rejection', (r && (r.stack || r.message)) || String(r));
  });
})();
</script>
</head>
<body>

<!-- ─────────────── Route list ─────────────── -->
<section id="list-screen" class="screen active">
  <button class="settings-fab" id="open-settings" aria-label="Instellingen">⚙️</button>
  <div class="page">
    <div class="hero">
      <div class="eyebrow" data-i18n="header.eyebrow">Gesproken rijgids</div>
      <h1>Sardegna</h1>
      <p id="header-sub"></p>
    </div>

    <div class="audio-status">
      <div>🚗</div>
      <div>
        <div class="name" id="audio-name"></div>
        <div class="detail" id="audio-detail">—</div>
      </div>
      <button id="test-audio" data-i18n="audio.test">Test</button>
    </div>

    <div class="overview-wrap">
      <div id="overview-map"></div>
      <div class="overview-legend" id="overview-legend"></div>
    </div>

    <div id="route-list"></div>

    <div class="import-block">
      <input type="file" id="gpx-input" accept=".gpx,application/gpx+xml,text/xml" hidden>
      <div class="mode-picker" id="mode-picker"></div>
      <button class="btn-import" id="import-gpx">
        <span>＋</span><span id="import-label">Route toevoegen uit GPX</span>
      </button>
      <p class="import-hint" id="import-hint"></p>
      <div class="import-progress" id="import-progress" style="display:none">
        <div class="msg" id="import-msg"></div>
        <div class="import-bar"><span id="import-bar-fill"></span></div>
      </div>
      <p class="import-error" id="import-error" style="display:none"></p>
    </div>

    <p class="footnote" data-i18n="footer.note"></p>
  </div>
</section>

<!-- ─────────────── Route detail ─────────────── -->
<section id="detail-screen" class="screen">
  <div class="page">
    <button class="btn-secondary" id="back-to-list" style="margin-bottom:14px;max-width:120px">← <span data-i18n="nav.back">Terug</span></button>
    <div id="map-preview"></div>
    <div class="detail-title">
      <div class="eyebrow" id="detail-region"></div>
      <h2 id="detail-name"></h2>
    </div>
    <p class="detail-summary" id="detail-summary"></p>

    <div class="weather-panel" id="weather-panel" style="display:none"></div>

    <div class="panel">
      <div class="facts-grid">
        <div class="metric"><div class="value" id="detail-distance"></div><div class="eyebrow" data-i18n="detail.distance">Afstand</div></div>
        <div class="metric"><div class="value" id="detail-duration"></div><div class="eyebrow" data-i18n="detail.duration">Rijtijd</div></div>
        <div class="metric"><div class="value" id="detail-count"></div><div class="eyebrow" data-i18n="detail.stories">Verhalen</div></div>
      </div>
      <hr class="seam">
      <div class="labelled"><div class="eyebrow" data-i18n="detail.character">Karakter</div><div class="value" id="detail-character"></div></div>
      <div class="labelled"><div class="eyebrow" data-i18n="detail.bestTime">Beste moment</div><div class="value" id="detail-besttime"></div></div>
    </div>

    <button class="btn-primary" id="start-drive">▶ <span data-i18n="detail.start">Start de rit</span></button>
    <button class="btn-secondary" id="reverse-route">⇄ <span id="reverse-label"></span></button>
    <button class="btn-secondary" id="open-osm">🗺 <span data-i18n="detail.openMaps">Open in kaarten-app</span></button>
    <button class="link-button" id="open-osm-alt"></button>

    <div class="highlight-list" id="highlight-list"></div>

    <div class="story-block" id="story-block">
      <div class="story-head">
        <div>
          <div class="eyebrow" style="color:var(--amber-soft)" id="story-eyebrow"></div>
          <div class="story-status" id="story-status"></div>
        </div>
        <button class="btn-story" id="story-generate"></button>
      </div>
      <div class="import-progress" id="story-progress" style="display:none">
        <div class="msg" id="story-msg"></div>
        <div class="import-bar"><span id="story-bar-fill"></span></div>
        <button class="link-button" id="story-cancel"></button>
      </div>
      <p class="import-error" id="story-error" style="display:none"></p>
    </div>

    <div class="story-block" id="audio-block" style="display:none">
      <div class="story-head">
        <div>
          <div class="eyebrow" style="color:var(--shallow)" id="audio-eyebrow"></div>
          <div class="story-status" id="audio-status"></div>
        </div>
        <button class="btn-story" id="audio-generate" style="background:color-mix(in srgb, var(--sea) 22%, transparent);border-color:color-mix(in srgb, var(--sea) 50%, transparent);color:var(--shallow)"></button>
      </div>
      <div class="import-progress" id="audio-progress" style="display:none">
        <div class="msg" id="audio-msg"></div>
        <div class="import-bar"><span id="audio-bar-fill"></span></div>
        <button class="link-button" id="audio-cancel"></button>
      </div>
      <p class="import-error" id="audio-error" style="display:none"></p>
    </div>

    <div class="story-block" id="facts-block" style="display:none">
      <div class="story-head">
        <div>
          <div class="eyebrow" style="color:var(--shallow)" id="facts-eyebrow"></div>
          <div class="story-status" id="facts-status"></div>
        </div>
        <button class="btn-story" id="facts-generate" style="background:color-mix(in srgb, var(--sea) 22%, transparent);border-color:color-mix(in srgb, var(--sea) 50%, transparent);color:var(--shallow)"></button>
      </div>
      <div class="import-progress" id="facts-progress" style="display:none">
        <div class="msg" id="facts-msg"></div>
        <div class="import-bar"><span id="facts-bar-fill" style="width:40%"></span></div>
      </div>
      <p class="import-error" id="facts-error" style="display:none"></p>
      <button class="link-button" id="facts-export" style="display:none"></button>
    </div>

    <div class="dining-section" id="dining-section" style="display:none">
      <div class="eyebrow" id="dining-eyebrow" style="color:var(--amber-soft)"></div>
      <p class="dining-intro" id="dining-intro"></p>
      <div id="dining-list"></div>
    </div>
  </div>
</section>

<!-- ─────────────── Drive screen ─────────────── -->
<section id="drive-screen" class="screen">
  <div id="drive-map"></div>

  <div class="drive-top-stack" id="drive-top-stack">
    <div class="drive-top">
      <button class="close-btn" id="end-drive">✕</button>
      <div class="pill" id="drive-audio-pill">🚗 <span id="drive-audio-name">—</span></div>
      <div class="speed-pill"><span id="drive-speed">0</span><span data-i18n="drive.kmh">km/u</span></div>
    </div>

    <div class="maneuver-banner" id="maneuver-banner" style="display:none">
      <div class="mb-glyph" id="mb-glyph">⬆</div>
      <div class="mb-text">
        <div class="mb-instruction" id="mb-instruction"></div>
        <div class="mb-road" id="mb-road"></div>
      </div>
      <div class="mb-distance" id="mb-distance"></div>
    </div>

    <div class="wakelock-row">
      <div class="pill" id="wakelock-pill"></div>
    </div>
  </div>

  <div class="now-playing">
    <div class="ribbon" id="ribbon"></div>
    <div id="now-content"></div>
    <div class="off-route-notice" id="off-route-notice" style="display:none"></div>
    <div class="music-bar" id="music-bar" style="display:none">
      <img class="music-art" id="music-art" alt="">
      <div class="music-meta">
        <div class="music-title" id="music-title">—</div>
        <div class="music-sub" id="music-sub"></div>
      </div>
      <div class="music-controls">
        <button id="music-prev" aria-label="Vorige">⏮</button>
        <button id="music-toggle" aria-label="Afspelen of pauzeren">▶</button>
        <button id="music-next" aria-label="Volgende">⏭</button>
      </div>
    </div>
    <div class="music-source" id="music-source" style="display:none">
      <button data-source="spotify">Spotify</button>
      <button data-source="radio">Radio</button>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="ctrl-repeat"><span class="icon">↺</span><span class="label" data-i18n="drive.repeat">Opnieuw</span></button>
      <button class="ctrl-btn" id="ctrl-skip"><span class="icon">⏭</span><span class="label" data-i18n="drive.skip">Overslaan</span></button>
      <button class="ctrl-btn accent" id="ctrl-fact"><span class="icon">✨</span><span class="label" data-i18n="drive.fact">Weetje</span></button>
    </div>
  </div>
</section>

<!-- ─────────────── Settings sheet ─────────────── -->
<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet" id="settings-sheet">
    <div class="sheet-header">
      <h3 data-i18n="settings.title">Instellingen</h3>
      <button id="close-settings" style="font-size:20px">✕</button>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-title" data-i18n="settings.language">Taal</div>
      <div class="segmented" id="lang-toggle">
        <button data-lang="nl">Nederlands</button>
        <button data-lang="en">English</button>
      </div>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-title" data-i18n="settings.appearance">Weergave</div>
      <div class="segmented" id="theme-toggle">
        <button data-theme-mode="auto" data-i18n="settings.themeAuto">Automatisch</button>
        <button data-theme-mode="light" data-i18n="settings.themeLight">Licht</button>
        <button data-theme-mode="dark" data-i18n="settings.themeDark">Donker</button>
      </div>
      <p class="import-hint" id="theme-explain"></p>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-title" data-i18n="settings.voice">Stem</div>
      <div class="setting-row">
        <label data-i18n="settings.rate">Spreeksnelheid</label>
        <span class="value" id="rate-value">0.95</span>
      </div>
      <input type="range" id="rate-slider" min="0.6" max="1.3" step="0.05">
      <div class="setting-row" style="margin-top:8px">
        <label data-i18n="settings.chime">Toon vóór elk verhaal</label>
        <div class="toggle" id="chime-toggle"></div>
      </div>
      <p class="import-error" id="voice-notice" style="display:none"></p>
      <div class="voice-list" id="voice-list"></div>
      <p class="import-hint" id="voice-hint"></p>
      <button class="link-button" id="voice-diagnostics"></button>

      <div class="music-setup">
        <div class="setup-title" id="cloud-title"></div>
        <p class="import-hint" id="cloud-explain"></p>
        <div class="setting-row">
          <label id="cloud-toggle-label"></label>
          <div class="toggle" id="cloud-toggle"></div>
        </div>
        <input type="password" id="google-key" class="text-input" placeholder="Google API-sleutel" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p class="import-hint" id="cloud-status"></p>
        <div class="voice-list" id="cloud-voice-list"></div>
      </div>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-title" data-i18n="settings.driving">Onderweg</div>
      <div class="setting-row">
        <label data-i18n="settings.turnByTurn">Navigatie-instructies</label>
        <div class="toggle" id="nav-toggle"></div>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.facts">Weetjes tussendoor</label>
        <div class="toggle" id="facts-toggle"></div>
      </div>
      <div class="setting-row" style="margin-top:8px">
        <label data-i18n="settings.interval">Na hoeveel stilte</label>
        <span class="value" id="interval-value">7 min</span>
      </div>
      <input type="range" id="interval-slider" min="3" max="20" step="1">
    </div>

    <div class="sheet-section">
      <div class="sheet-section-title" data-i18n="settings.stories">Verhalen</div>
      <p class="import-hint" id="ai-explain"></p>
      <input type="password" id="ai-key" class="text-input" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="setting-row" style="margin-top:10px">
        <label data-i18n="settings.model">Model</label>
      </div>
      <div class="segmented" id="ai-model"></div>
      <p class="import-hint" id="ai-status"></p>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-title" data-i18n="settings.power">Energie</div>
      <div class="setting-row">
        <label data-i18n="settings.powerSaving">Scherm dimmen bij rust</label>
        <div class="toggle" id="power-toggle"></div>
      </div>
      <div class="setting-row" style="margin-top:6px">
        <label data-i18n="settings.dimLevel">Hoe donker</label>
        <span class="value" id="dim-value">45%</span>
      </div>
      <input type="range" id="dim-slider" min="20" max="70" step="5">
      <p class="import-hint" id="power-hint"></p>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-title" data-i18n="settings.music">Muziek</div>

      <div class="setting-row">
        <label data-i18n="settings.duck">Muziek zachter tijdens een verhaal</label>
        <div class="toggle" id="duck-toggle"></div>
      </div>
      <div class="setting-row" style="margin-top:6px">
        <label data-i18n="settings.duckLevel">Hoe zacht</label>
        <span class="value" id="duck-value">25%</span>
      </div>
      <input type="range" id="duck-slider" min="5" max="70" step="5">

      <div class="music-setup">
        <div class="setup-title">Spotify</div>
        <p class="import-hint" id="spotify-status"></p>
        <input type="text" id="spotify-client-id" class="text-input" placeholder="Spotify Client ID" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p class="import-hint" id="spotify-redirect-note"></p>
        <button class="btn-secondary" id="spotify-login">Koppel Spotify</button>
        <button class="btn-secondary" id="spotify-logout" style="display:none">Ontkoppel Spotify</button>
      </div>

      <div class="music-setup">
        <div class="setup-title" data-i18n="settings.radio">Radio</div>
        <div class="setting-row">
          <label data-i18n="settings.radioVolume">Radiovolume</label>
          <span class="value" id="radio-volume-value">80%</span>
        </div>
        <input type="range" id="radio-volume" min="0" max="100" step="5">
        <p class="import-hint" id="radio-volume-note" style="display:none"></p>
        <div class="station-search">
          <input type="text" id="station-query" class="text-input" placeholder="Zoek een zender, bv. Qmusic">
          <button class="btn-secondary" id="station-search-btn" style="margin-top:8px">Zoeken</button>
        </div>
        <div id="station-list" class="station-list"></div>
      </div>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-title" data-i18n="settings.online">Online extra's</div>
      <div class="setting-row">
        <label data-i18n="settings.wikipedia">Extra achtergrond van Wikipedia</label>
        <div class="toggle" id="wiki-toggle"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
